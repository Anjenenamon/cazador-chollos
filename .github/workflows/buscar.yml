name: Buscar chollos

# Horario de España: lunes a viernes 8:00 y 17:00; sábado y domingo 6, 10, 14, 18 y 22 h.
# GitHub retrasa o se salta a veces las ejecuciones programadas, así que se comprueba
# cada hora (y además 10 min antes de cada hora de búsqueda) si falta alguna;
# horario.py decide y solo busca cuando toca, sin repetir.
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "50 4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Toca buscar ahora?
        id: hora
        run: python3 horario.py
        env:
          EVENTO: ${{ github.event_name }}

      - name: Buscar en eBay
        if: steps.hora.outputs.toca == 'si'
        run: python3 buscador.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}

      - name: Guardar resultados
        if: steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "cazador-chollos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/datos.json datos/historial.json
          git diff --cached --quiet || git commit -m "Búsqueda $(TZ=Europe/Madrid date '+%d/%m %H:%M')"
          git push

      - uses: actions/configure-pages@v5
        if: steps.hora.outputs.toca == 'si'

      - uses: actions/upload-pages-artifact@v4
        if: steps.hora.outputs.toca == 'si'
        with:
          path: docs

      - id: publicar
        if: steps.hora.outputs.toca == 'si'
        uses: actions/deploy-pages@v4

      - name: Avisar por correo
        if: steps.hora.outputs.toca == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 aviso.py > aviso.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=avisos&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create avisos --color FBCA04 --description "Avisos del buscador" 2>/dev/null || true
            url=$(gh issue create --title "Avisos del Cazador de Chollos" --label avisos \
              --body "Aquí se apunta un resumen de cada búsqueda. GitHub te lo envía por correo.")
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file aviso.md
